          package com.bot.cook

          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection

          class Capture(proj: MediaProjection, private val w: Int, private val h: Int, dpi: Int) {
              private val reader: ImageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 2)
              private val vd: VirtualDisplay = proj.createVirtualDisplay(
                  "cookbot", w, h, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.surface, null, null
              )
              private var last: Bitmap? = null

              // Последний кадр, приведённый к размеру 2576x1159
              fun frame(): Bitmap? {
                  val img = reader.acquireLatestImage()
                  if (img != null) {
                      val p = img.planes[0]
                      val tmp = Bitmap.createBitmap(p.rowStride / p.pixelStride, h, Bitmap.Config.ARGB_8888)
                      tmp.copyPixelsFromBuffer(p.buffer)
                      img.close()
                      val cropped = Bitmap.createBitmap(tmp, 0, 0, w, h)
                      val scaled = Bitmap.createScaledBitmap(cropped, Vision.RW, Vision.RH, true)
                      if (cropped !== scaled) cropped.recycle()
                      if (tmp !== cropped) tmp.recycle()
                      last?.recycle()
                      last = scaled
                  }
                  return last
              }

              fun release() {
                  vd.release()
                  reader.close()
              }
          }
