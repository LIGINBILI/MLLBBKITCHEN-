          package com.bot.cook

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
                  val l = LinearLayout(this)
                  l.orientation = LinearLayout.VERTICAL
                  l.setPadding(40, 80, 40, 40)
                  val info = TextView(this)
                  info.text = "Выполни шаги 1-3 по порядку, потом открой игру и нажми СТАРТ на плавающей панели (справа внизу)."
                  l.addView(info)
                  fun add(t: String, a: () -> Unit) {
                      val b = Button(this)
                      b.text = t
                      b.setOnClickListener { a() }
                      l.addView(b)
                  }
                  add("1. Разрешить поверх других окон") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + packageName)))
                  }
                  add("2. Включить службу спецвозможностей") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  add("3. Запустить бота") {
                      val m = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(m.createScreenCaptureIntent(), 7)
                  }
                  val sv = ScrollView(this)
                  sv.addView(l)
                  setContentView(sv)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 7 && resultCode == RESULT_OK && data != null) {
                      val i = Intent(this, BotService::class.java)
                      i.putExtra("code", resultCode)
                      i.putExtra("data", data)
                      startForegroundService(i)
                      moveTaskToBack(true)
                  }
              }
          }
