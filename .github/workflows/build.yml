          package com.bot.cook

          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.PixelFormat
          import android.graphics.Rect
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection

          class Capture(proj: MediaProjection, private val w: Int, private val h: Int, dpi: Int) : Frames {
              private val reader: ImageReader = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
              private val vd: VirtualDisplay = proj.createVirtualDisplay(
                  "cookbot", w, h, dpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader.surface, null, null
              )
              // Битмапы создаются один раз и переиспользуются, чтобы не забивать память
              private val out: Bitmap = Bitmap.createBitmap(Vision.RW, Vision.RH, Bitmap.Config.ARGB_8888)
              private val canvas = Canvas(out)
              private val paint = Paint(Paint.FILTER_BITMAP_FLAG)
              private val src = Rect(0, 0, w, h)
              private val dst = Rect(0, 0, Vision.RW, Vision.RH)
              private var raw: Bitmap? = null
              private var have = false
              private var fresh = 0

              // Последний кадр, приведённый к размеру 2576x1159
              override fun frame(): Bitmap? {
                  val img = reader.acquireLatestImage()
                  if (img != null) {
                      try {
                          val p = img.planes[0]
                          val rw = p.rowStride / p.pixelStride
                          var t: Bitmap? = raw
                          if (t == null || t.width != rw) {
                              t?.recycle()
                              raw = Bitmap.createBitmap(rw, h, Bitmap.Config.ARGB_8888)
                          }
                          val bm: Bitmap = raw!!
                          bm.copyPixelsFromBuffer(p.buffer)
                          canvas.drawBitmap(bm, src, dst, paint)
                          have = true
                          fresh++
                      } finally {
                          img.close()
                      }
                  }
                  return if (have) out else null
              }

              override fun info(): String = "MP new=" + fresh + " " + w + "x" + h

              fun release() {
                  vd.release()
                  reader.close()
              }
          }
          EOF_10
