          cat > bot/app/src/main/java/com/bot/cook/SettingsActivity.kt <<'EOF_17'
          package com.bot.cook

          import android.app.Activity
          import android.graphics.Color
          import android.graphics.Typeface
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView

          class SettingsActivity : Activity() {
              private fun dp(x: Int): Int = (x * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  S.init(this)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setPadding(dp(16), dp(40), dp(16), dp(24))
                  val title = TextView(this)
                  title.text = "Настройки бота (действуют сразу, даже когда бот работает)"
                  title.textSize = 18f
                  title.setTypeface(null, Typeface.BOLD)
                  root.addView(title)
                  var group = ""
                  for (o in S.ALL) {
                      if (o.group != group) {
                          group = o.group
                          val h = TextView(this)
                          h.text = group
                          h.textSize = 16f
                          h.setTypeface(null, Typeface.BOLD)
                          h.setTextColor(Color.rgb(30, 80, 160))
                          h.setPadding(0, dp(22), 0, dp(4))
                          root.addView(h)
                      }
                      addRow(root, o)
                  }
                  val reset = Button(this)
                  reset.text = "Сбросить всё по умолчанию"
                  reset.setOnClickListener {
                      S.reset()
                      recreate()
                  }
                  root.addView(reset)
                  val back = Button(this)
                  back.text = "Назад"
                  back.setOnClickListener { finish() }
                  root.addView(back)
                  val sv = ScrollView(this)
                  sv.addView(root)
                  setContentView(sv)
              }

              private fun addRow(root: LinearLayout, o: Opt) {
                  val head = LinearLayout(this)
                  head.orientation = LinearLayout.HORIZONTAL
                  head.setPadding(0, dp(12), 0, 0)
                  val name = TextView(this)
                  name.text = o.title
                  name.textSize = 14f
                  head.addView(name, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  val value = TextView(this)
                  value.textSize = 16f
                  value.setTypeface(null, Typeface.BOLD)
                  value.setTextColor(Color.rgb(200, 60, 0))
                  head.addView(value)
                  root.addView(head)
                  if (o.hint.isNotEmpty()) {
                      val hint = TextView(this)
                      hint.text = o.hint
                      hint.textSize = 11f
                      hint.setTextColor(Color.GRAY)
                      root.addView(hint)
                  }
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  val minus = Button(this)
                  minus.text = "-"
                  minus.minWidth = 0
                  minus.minimumWidth = 0
                  val plus = Button(this)
                  plus.text = "+"
                  plus.minWidth = 0
                  plus.minimumWidth = 0
                  val sb = SeekBar(this)
                  sb.max = (o.max - o.min) / o.step
                  val cur = S.get(o.key).coerceIn(o.min, o.max)
                  sb.progress = (cur - o.min) / o.step
                  value.text = S.text(o, cur)
                  sb.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                      override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                          val v = o.min + p * o.step
                          S.set(o.key, v)
                          value.text = S.text(o, v)
                      }

                      override fun onStartTrackingTouch(s: SeekBar?) {}

                      override fun onStopTrackingTouch(s: SeekBar?) {}
                  })
                  minus.setOnClickListener { sb.progress = maxOf(0, sb.progress - 1) }
                  plus.setOnClickListener { sb.progress = minOf(sb.max, sb.progress + 1) }
                  row.addView(minus, LinearLayout.LayoutParams(dp(52), dp(48)))
                  row.addView(sb, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  row.addView(plus, LinearLayout.LayoutParams(dp(52), dp(48)))
                  root.addView(row)
              }
          }
