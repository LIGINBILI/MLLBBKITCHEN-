          package com.bot.cook

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.Context
          import android.content.Intent
          import android.graphics.Path
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import android.view.accessibility.AccessibilityEvent
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.TimeUnit
          import kotlin.math.max
          import kotlin.math.min

          // Одно действие: нажатие (drag = false) или перетаскивание из (x1,y1) в (x2,y2)
          class Act(val x1: Int, val y1: Int, val x2: Int, val y2: Int, val drag: Boolean)

          class TapService : AccessibilityService() {
              override fun onServiceConnected() {
                  S.init(this)
                  inst = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  inst = null
                  return super.onUnbind(intent)
              }

              // Серия действий по очереди; ждёт завершения
              private fun doRun(acts: List<Act>, gap: Long) {
                  val dm = DisplayMetrics()
                  @Suppress("DEPRECATION")
                  (getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  val sw = max(dm.widthPixels, dm.heightPixels).toFloat()
                  val sh = min(dm.widthPixels, dm.heightPixels).toFloat()
                  for (chunk in acts.chunked(8)) {
                      val b = GestureDescription.Builder()
                      var t = 0L
                      for (a in chunk) {
                          val path = Path()
                          path.moveTo(a.x1 * sw / Vision.RW, a.y1 * sh / Vision.RH)
                          val dur: Long
                          if (a.drag) {
                              path.lineTo(a.x2 * sw / Vision.RW, a.y2 * sh / Vision.RH)
                              dur = S.get("swipeDur").toLong()
                          } else {
                              dur = S.get("tapDur").toLong()
                          }
                          b.addStroke(GestureDescription.StrokeDescription(path, t, dur))
                          t += dur + gap
                      }
                      val latch = CountDownLatch(1)
                      val ok = dispatchGesture(b.build(), object : GestureResultCallback() {
                          override fun onCompleted(gestureDescription: GestureDescription?) {
                              latch.countDown()
                          }

                          override fun onCancelled(gestureDescription: GestureDescription?) {
                              latch.countDown()
                          }
                      }, null)
                      if (ok) latch.await(t + 1500, TimeUnit.MILLISECONDS)
                  }
              }

              companion object {
                  @Volatile
                  var inst: TapService? = null

                  fun ready(): Boolean = inst != null

                  fun run(acts: List<Act>, gap: Long = S.get("tapGap").toLong()) {
                      inst?.doRun(acts, gap)
                  }
              }
          }
