          package com.bot.cook

          import android.graphics.Bitmap
          import kotlin.math.abs

          object Vision {
              const val RW = 2576
              const val RH = 1159
              val SLOT_X = intArrayOf(1138, 1530, 1920)
              private const val Y0 = 160
              private const val Y1 = 432

              private val templates: Map<String, IntArray> by lazy {
                  Tpl.DATA.mapValues { e -> e.value.split(",").map { it.trim().toInt() }.toIntArray() }
              }

              private fun d(c: Int, r: Int, g: Int, b: Int): Int =
                  abs(((c shr 16) and 255) - r) + abs(((c shr 8) and 255) - g) + abs((c and 255) - b)

              // Читает заказ одного клиента: список блюд сверху вниз
              fun slotItems(bmp: Bitmap, cx: Int): List<String> {
                  val x0 = cx - 40
                  val w = 94
                  val ry0 = 120
                  val h = 360
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, x0, ry0, w, h)
                  fun at(x: Int, y: Int): Int = px[(y - ry0) * w + (x - x0)]

                  var cream = 0
                  var tot = 0
                  for (y in Y0 until Y1) for (x in cx + 42 until cx + 52) {
                      tot++
                      if (d(at(x, y), 255, 250, 221) < 45) cream++
                  }
                  if (cream.toDouble() / tot < 0.6) return emptyList()

                  val runs = ArrayList<IntArray>()
                  var s = -1
                  for (y in Y0 until Y1) {
                      var c = 0
                      for (x in cx - 36 until cx + 36) if (d(at(x, y), 255, 250, 221) > 90) c++
                      val flag = c > 2
                      if (flag && s < 0) s = y
                      if (!flag && s >= 0) {
                          if (y - s > 25) runs.add(intArrayOf(s, y))
                          s = -1
                      }
                  }
                  if (s >= 0 && Y1 - s > 25) runs.add(intArrayOf(s, Y1))

                  val res = ArrayList<String>()
                  for (run in runs) {
                      val cy = (run[0] + run[1]) / 2
                      val f = IntArray(192)
                      for (by in 0 until 8) for (bx in 0 until 8) {
                          var r = 0
                          var g = 0
                          var b = 0
                          for (yy in 0 until 10) for (xx in 0 until 10) {
                              val c = at(cx - 40 + bx * 10 + xx, cy - 40 + by * 10 + yy)
                              r += (c shr 16) and 255
                              g += (c shr 8) and 255
                              b += c and 255
                          }
                          val i = (by * 8 + bx) * 3
                          f[i] = r / 100
                          f[i + 1] = g / 100
                          f[i + 2] = b / 100
                      }
                      var best = "?"
                      var bd = 1e9
                      for ((name, t) in templates) {
                          var sum = 0
                          for (k in 0 until 192) sum += abs(f[k] - t[k])
                          val m = sum / 192.0
                          if (m < bd) {
                              bd = m
                              best = name
                          }
                      }
                      res.add(if (bd > 25) "?" else best)
                  }
                  return res
              }

              // 0 - пусто, 1 - сырая котлета, 2 - готовая
              fun grillState(bmp: Bitmap, x: Int, y: Int): Int {
                  val px = IntArray(24 * 24)
                  bmp.getPixels(px, 0, 24, x - 12, y - 12, 24, 24)
                  var r = 0
                  var g = 0
                  var b = 0
                  for (c in px) {
                      r += (c shr 16) and 255
                      g += (c shr 8) and 255
                      b += c and 255
                  }
                  r /= px.size
                  g /= px.size
                  b /= px.size
                  if (b < 60 && r > 130 && r - g > 50) return 2
                  if (r > 200 && r - g > 70 && b > 90) return 1
                  return 0
              }

              private fun avg(bmp: Bitmap, x: Int, y: Int, hx: Int, hy: Int): IntArray {
                  val w = 2 * hx + 1
                  val h = 2 * hy + 1
                  val px = IntArray(w * h)
                  bmp.getPixels(px, 0, w, x - hx, y - hy, w, h)
                  var r = 0
                  var g = 0
                  var b = 0
                  for (c in px) {
                      r += (c shr 16) and 255
                      g += (c shr 8) and 255
                      b += c and 255
                  }
                  return intArrayOf(r / px.size, g / px.size, b / px.size)
              }

              // Цвета пустых мест у автоматов колы и мороженого (из видео)
              private val COLA_BASE = arrayOf(intArrayOf(192, 89, 98), intArrayOf(164, 108, 128), intArrayOf(198, 82, 60))
              private val ICE_BASE = arrayOf(intArrayOf(209, 110, 12), intArrayOf(182, 111, 28), intArrayOf(182, 80, 5))

              private fun dist(c: IntArray, t: IntArray): Int = abs(c[0] - t[0]) + abs(c[1] - t[1]) + abs(c[2] - t[2])

              // Лежит ли готовое блюдо на этой позиции (тарелка, коробка фри, стакан, рожок)
              fun occupied(bmp: Bitmap, dish: String, i: Int, x: Int, y: Int): Boolean {
                  val c = avg(bmp, x, y, 10, 10)
                  return when (dish) {
                      "chicken", "fries" -> c[0] - c[2] > 20
                      "burger" -> c[0] in 140..180 && c[1] in 60..100 && c[2] < 35
                      "cola" -> dist(c, COLA_BASE[minOf(i, 2)]) > 40
                      "icecream" -> dist(c, ICE_BASE[minOf(i, 2)]) > 40
                      else -> false
                  }
              }

              // Пицца в слоте печи готова: оранжевая. Пустой слот серо-фиолетовый, выпекающийся розовый.
              fun ovenReady(bmp: Bitmap, x: Int, y: Int): Boolean {
                  val c = avg(bmp, x, y, 28, 11)
                  return c[0] > 235 && c[1] > 170 && c[2] < c[1] - 25
              }
          }
          EOF_9
