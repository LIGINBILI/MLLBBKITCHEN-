                  Opt("serveOn", "Подача клиентам", "Подавать блюда клиентам", 1, 0, 1, 1, "onoff", "Выключи, чтобы бот только готовил, а отдавал ты сам."),
                  Opt("serveDelay", "Подача клиентам", "Задержка перед подачей", 0, 0, 5000, 100, "мс", "Сколько блюдо должно полежать готовым, прежде чем бот его отдаст."),
                  Opt("serveGap", "Подача клиентам", "Пауза между свайпами при подаче", 100, 20, 800, 10, "мс", ""),
                  Opt("serveMax", "Подача клиентам", "Макс. свайпов за раз", 6, 1, 8, 1, "шт", "Сколько блюд бот отдаёт за один заход."),
                  Opt("dropDx", "Подача клиентам", "Точка сброса: сдвиг влево от окошка заказа", 220, 0, 400, 10, "px", "Если блюдо не доходит до клиента, меняй это и высоту."),
                  Opt("dropY", "Подача клиентам", "Точка сброса: высота", 430, 250, 600, 10, "px", "Больше - ниже на экране."),
                  Opt("idle", "Запас (готовить заранее)", "Готовить запас, когда нет заказов", 0, 0, 1, 1, "onoff", "Выкл: запас готовится, только пока есть хотя бы один заказ."),
                  Opt("stBurger", "Запас (готовить заранее)", "Бургеры в запасе", 4, 0, 4, 1, "шт", "Сколько бургеров держать готовыми. 0 - только под заказ."),
                  Opt("stPizza", "Запас (готовить заранее)", "Пиццы в запасе", 3, 0, 3, 1, "шт", "Печь вмещает 3."),
                  Opt("stChicken", "Запас (готовить заранее)", "Курица в запасе", 2, 0, 2, 1, "шт", ""),
                  Opt("stFries", "Запас (готовить заранее)", "Фри в запасе", 2, 0, 2, 1, "шт", ""),
                  Opt("stCola", "Запас (готовить заранее)", "Кола в запасе", 3, 0, 3, 1, "шт", ""),
                  Opt("stIce", "Запас (готовить заранее)", "Мороженое в запасе", 3, 0, 3, 1, "шт", ""),
                  Opt("fryMs", "Время готовки", "Время жарки фри и курицы", 3500, 1000, 9000, 250, "мс", "Через столько бот забирает еду из фритюрницы."),
                  Opt("pizzaRound", "Время готовки", "Пауза между партиями пиццы", 1500, 300, 4000, 100, "мс", "Пока в игре появятся новые основы."),
                  Opt("pizzaMade", "Время готовки", "Время выпечки пиццы", 5000, 2000, 10000, 250, "мс", "Столько бот считает пиццу «ещё печётся» и не печёт лишнюю.")
              )

              @Volatile
              private var sp: SharedPreferences? = null
              private val cache = ConcurrentHashMap<String, Int>()

              fun init(c: Context) {
                  if (sp == null) sp = c.applicationContext.getSharedPreferences("cookbot", Context.MODE_PRIVATE)
              }

              fun get(key: String): Int {
                  val c = cache[key]
                  if (c != null) return c
                  val o = ALL.firstOrNull { it.key == key } ?: return 0
                  val s = sp
                  if (s == null) return o.def
                  val v = s.getInt(key, o.def)
                  cache[key] = v
                  return v
              }

              fun set(key: String, v: Int) {
                  cache[key] = v
                  sp?.edit()?.putInt(key, v)?.apply()
              }

              fun reset() {
                  cache.clear()
                  val e = sp?.edit()
                  if (e != null) {
                      e.clear()
                      e.apply()
                  }
              }

              fun text(o: Opt, v: Int): String =
                  if (o.unit == "onoff") (if (v == 1) "вкл" else "выкл") else v.toString() + " " + o.unit
          }
