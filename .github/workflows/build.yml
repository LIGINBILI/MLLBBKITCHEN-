          package com.bot.cook

          import android.graphics.Bitmap

          class Engine(private val cap: Capture, private val ui: (String) -> Unit) : Thread() {
              @Volatile
              var running = true
              private val last = HashMap<String, Long>()
              private val collectAt = HashMap<String, Long>()
              private val stock = HashMap<String, Int>()
              private val prevDem = HashMap<String, Int>()
              private val changedAt = HashMap<String, Long>()
              private var frames = 0
              private var bPhase = 0
              private var bNeed = 0
              private var bGot = 0
              private var bStart = 0L
              private var pizzaReadyAt = 0L
              private var pizzaBusyUntil = 0L
              private val dishes = listOf("cola", "icecream", "chicken", "fries", "pizza", "burger")
              private val ru = mapOf(
                  "pizza" to "пицца", "burger" to "бургер", "cola" to "кола",
                  "icecream" to "мороженое", "fries" to "фри", "chicken" to "курица", "?" to "?"
              )

              private fun now() = System.currentTimeMillis()

              private fun st(k: String): Int = stock[k] ?: 0

              private fun due(k: String, ms: Long): Boolean {
                  val n = now()
                  val l = last[k] ?: 0L
                  if (n - l >= ms) {
                      last[k] = n
                      return true
                  }
                  return false
              }

              private fun tapA(p: IntArray) = Act(p[0], p[1], p[0], p[1], false)

              private fun go(acts: List<Act>, gap: Long = 120L) {
                  if (acts.isNotEmpty()) TapService.run(acts, gap)
              }

              override fun run() {
                  while (running) {
                      try {
                          step()
                      } catch (e: Throwable) {
                          ui("Ошибка: " + e.toString())
                      }
                      try {
                          Thread.sleep(150)
                      } catch (e: InterruptedException) {
                          return
                      }
                  }
              }

              // Следим за тем, сколько готовых блюд лежит: заказ ушёл - значит блюдо отдано
              private fun updateStock(dem: Map<String, Int>) {
                  val n = now()
                  for (k in dishes) {
                      val cur = dem[k] ?: 0
                      val prev = prevDem[k] ?: 0
                      if (cur < prev) stock[k] = maxOf(0, st(k) - (prev - cur))
                      if (cur != prev) changedAt[k] = n
                      val ch = changedAt[k] ?: n
                      changedAt[k] = ch
                      // Заказ не меняется давно, а мы думаем, что блюдо готово: значит оценка неверна
                      if (cur > 0 && st(k) >= cur && n - ch > 14000L) {
                          stock[k] = 0
                          changedAt[k] = n
                      }
                      prevDem[k] = cur
                  }
              }

              // Приготовление в фритюрнице: нажать источник, подождать, забрать
              private fun cook(key: String, dish: String, src: IntArray, out: IntArray, cookMs: Long) {
                  val c = collectAt[key]
                  if (c != null) {
                      if (now() >= c) {
                          go(listOf(tapA(out)))
                          collectAt.remove(key)
                          stock[dish] = st(dish) + 1
                      }
                  } else if (due(key, 1500L)) {
                      go(listOf(tapA(src)))
                      collectAt[key] = now() + cookMs
                  }
              }

              private fun serve(slots: List<List<String>>) {
                  val acts = ArrayList<Act>()
                  for ((si, items) in slots.withIndex()) {
                      val counts = items.groupingBy { it }.eachCount()
                      for ((name, _) in counts) {
                          if (name == "?") continue
                          if (st(name) <= 0) continue
                          if (name == "pizza" && now() < pizzaReadyAt) continue
                          val locs = Cfg.SERVE[name] ?: continue
                          if (!due("s$si$name", 1400L)) continue
                          val c = Cfg.customer(Vision.SLOT_X[si])
                          for (l in locs) acts.add(Act(l[0], l[1], c[0], c[1], true))
                      }
                  }
                  if (acts.isNotEmpty()) go(acts.take(8), 150L)
              }

              private fun pizza() {
                  if (now() < pizzaBusyUntil) return
                  val acts = ArrayList<Act>()
                  acts.add(tapA(Cfg.SAUSAGE))
                  acts.add(tapA(Cfg.ONION))
                  acts.add(tapA(Cfg.SAUSAGE))
                  acts.add(tapA(Cfg.ONION))
                  go(acts, 350L)
                  Thread.sleep(500)
                  go(listOf(tapA(Cfg.BASE1), tapA(Cfg.BASE2)), 350L)
                  stock["pizza"] = st("pizza") + 2
                  pizzaReadyAt = now() + 4500L
                  pizzaBusyUntil = now() + 2500L
              }

              private fun burger(dem: Map<String, Int>, bmp: Bitmap) {
                  val d = dem["burger"] ?: 0
                  val gs = Cfg.GRILLS.map { Vision.grillState(bmp, it[0], it[1]) }
                  if (bPhase == 0) {
                      val need = minOf(4 - st("burger"), d - st("burger"))
                      if (need > 0 && due("bstart", 2000L)) {
                          val free = gs.count { it == 0 }
                          val onGrill = gs.count { it != 0 }
                          val raw = minOf(free, maxOf(0, need - onGrill))
                          val acts = ArrayList<Act>()
                          for (i in 0 until raw) acts.add(tapA(Cfg.PATTY))
                          for (i in 0 until need) acts.add(tapA(Cfg.LETTUCE))
                          for (i in 0 until need) acts.add(tapA(Cfg.TOMATO))
                          go(acts, 300L)
                          bPhase = 1
                          bNeed = need
                          bGot = 0
                          bStart = now()
                      }
                  } else {
                      val ready = ArrayList<IntArray>()
                      for ((i, g) in Cfg.GRILLS.withIndex()) if (gs[i] == 2) ready.add(g)
                      if (ready.isNotEmpty() && bGot < bNeed && due("grl", 900L)) {
                          val take = ready.take(bNeed - bGot)
                          go(take.map { tapA(it) }, 300L)
                          bGot += take.size
                      }
                      if (bGot >= bNeed || now() - bStart > 25000L) {
                          if (bGot > 0) {
                              val acts = ArrayList<Act>()
                              for (i in 0 until bGot) acts.add(tapA(Cfg.BUN))
                              go(acts, 300L)
                              stock["burger"] = st("burger") + bGot
                          }
                          bPhase = 0
                      }
                  }
              }

              private fun step() {
                  val bmp = cap.frame()
                  if (bmp == null) {
                      ui("Нет кадра экрана")
                      Thread.sleep(400)
                      return
                  }
                  frames++
                  val slots = Vision.SLOT_X.map { Vision.slotItems(bmp, it) }
                  val dem = HashMap<String, Int>()
                  for (s in slots) for (n in s) if (n != "?") dem[n] = (dem[n] ?: 0) + 1
                  updateStock(dem)

                  val sb = StringBuilder()
                  for ((i, s) in slots.withIndex()) {
                      sb.append(i + 1).append(": ")
                      sb.append(if (s.isEmpty()) "-" else s.joinToString("+") { ru[it] ?: it })
                      sb.append("\n")
                  }
                  sb.append("кадр ").append(frames)
                  if (!TapService.ready()) {
                      ui(sb.toString() + "\nВключи службу спецвозможностей!")
                      Thread.sleep(500)
                      return
                  }
                  ui(sb.toString())
                  if (dem.isEmpty() && bPhase == 0 && collectAt.isEmpty()) {
                      Thread.sleep(300)
                      return
                  }

                  // 1. Подача: готовое блюдо тянем к клиенту
                  serve(slots)

                  // 2. Приготовление недостающего
                  if ((dem["cola"] ?: 0) > st("cola") && due("cola", 3000L)) {
                      go(listOf(tapA(Cfg.COLA_M)))
                      stock["cola"] = 3
                  }
                  if ((dem["icecream"] ?: 0) > st("icecream") && due("ice", 3000L)) {
                      go(listOf(tapA(Cfg.ICE_M)))
                      stock["icecream"] = 3
                  }
                  if ((dem["chicken"] ?: 0) > st("chicken") || collectAt.containsKey("chk")) {
                      cook("chk", "chicken", Cfg.CHK_SRC, Cfg.FRY1, 6500L)
                  }
                  if ((dem["fries"] ?: 0) > st("fries") || collectAt.containsKey("fry")) {
                      cook("fry", "fries", Cfg.POT_SRC, Cfg.FRY2, 6500L)
                  }
                  if ((dem["pizza"] ?: 0) > st("pizza")) pizza()
                  if ((dem["burger"] ?: 0) > st("burger") || bPhase != 0) burger(dem, bmp)
              }
          }
