          package com.bot.cook

          import android.graphics.Bitmap

          class Src(val key: String, val p: IntArray)

          class Engine(private val cap: Frames, private val ui: (String) -> Unit) : Thread() {
              @Volatile
              var running = true
              private val last = HashMap<String, Long>()
              private val collectAt = HashMap<String, Long>()
              private val cookN = HashMap<String, Int>()
              private val seen = HashMap<String, Int>()
              private val firstSeen = HashMap<String, Long>()
              private val usedAt = HashMap<String, Long>()
              private val sentAt = HashMap<String, ArrayList<Long>>()
              private val madeAt = HashMap<String, ArrayList<Long>>()
              private val tapAt = HashMap<String, Long>()
              private val have = HashMap<String, Int>()
              private var frames = 0
              private var bPhase = 0
              private var bNeed = 0
              private var bGot = 0
              private var bStart = 0L
              private var bBlock = 0L
              private var pizzaBusyUntil = 0L

              // Сколько миллисекунд блюдо считается "уже поставлено готовиться"
              private fun pend(dish: String): Long = when (dish) {
                  "cola" -> 2400L
                  "icecream" -> 2800L
                  "pizza" -> S.get("pizzaMade").toLong()
                  "chicken" -> 2000L
                  "fries" -> 2000L
                  else -> 2500L
              }

              private val ru = mapOf(
                  "pizza" to "пицца", "burger" to "бургер", "cola" to "кола",
                  "icecream" to "мороженое", "fries" to "фри", "chicken" to "курица", "?" to "?"
              )

              private fun now() = System.currentTimeMillis()

              // Короткая подпись кадра: если она не меняется, кадр завис
              private fun sig(b: Bitmap): Int {
                  var h = 17
                  for (i in 1..8) for (j in 1..4) h = h * 31 + b.getPixel(b.width * i / 9, b.height * j / 5)
                  return h
              }

              private fun due(k: String, ms: Long): Boolean {
                  val n = now()
                  val l = last[k] ?: 0L
                  if (n - l >= ms) {
                      last[k] = n
                      return true
                  }
                  return false
              }

              private fun recent(map: HashMap<String, ArrayList<Long>>, key: String, ms: Long): Int {
                  val l = map[key] ?: return 0
                  val n = now()
                  l.removeAll { n - it > ms }
                  return l.size
              }

              private fun mark(map: HashMap<String, ArrayList<Long>>, key: String) {
                  map.getOrPut(key) { ArrayList() }.add(now())
              }

              private fun made(dish: String): Int = recent(madeAt, dish, pend(dish))

              private fun haveOf(dish: String): Int = have[dish] ?: 0

              private fun tapA(p: IntArray) = Act(p[0], p[1], p[0], p[1], false)

              private fun go(acts: List<Act>, gap: Long = S.get("tapGap").toLong()) {
                  if (acts.isNotEmpty()) TapService.run(acts, gap)
              }

              // Сколько штук блюда держать готовыми: заказы клиентов или запас из настроек (что больше), но не больше мест
              private fun target(dish: String, dem: Map<String, Int>, active: Boolean): Int {
                  val room = Cfg.SERVE[dish]?.size ?: 0
                  val d = dem[dish] ?: 0
                  val st = when (dish) {
                      "burger" -> S.get("stBurger")
                      "pizza" -> S.get("stPizza")
                      "chicken" -> S.get("stChicken")
                      "fries" -> S.get("stFries")
                      "cola" -> S.get("stCola")
                      "icecream" -> S.get("stIce")
                      else -> 0
                  }
                  val t = if (active) maxOf(d, st) else d
                  return minOf(t, room)
              }

              override fun run() {
                  while (running) {
                      try {
                          step()
                      } catch (e: Throwable) {
                          ui("Ошибка: " + e.toString())
                      }
                      try {
                          Thread.sleep(S.get("loopMs").toLong())
                      } catch (e: InterruptedException) {
                          return
                      }
                  }
              }

              // Лежит ли на этой позиции готовое блюдо (по цвету в точке)
              private fun readyAt(dish: String, i: Int, p: IntArray, bmp: Bitmap): Boolean {
                  return when (dish) {
                      "pizza" -> Vision.ovenReady(bmp, p[0], p[1])
                      else -> Vision.occupied(bmp, dish, i, p[0], p[1])
                  }
              }

              // Просматривает все позиции с готовыми блюдами. Блюдо считается готовым, если его видно на двух кадрах подряд.
              private fun scan(bmp: Bitmap): HashMap<String, ArrayList<Src>> {
                  val n = now()
                  val delay = S.get("serveDelay").toLong()
                  val res = HashMap<String, ArrayList<Src>>()
                  have.clear()
                  for ((dish, locs) in Cfg.SERVE) {
                      for ((i, l) in locs.withIndex()) {
                          val key = dish + i
                          if (readyAt(dish, i, l, bmp)) {
                              val c = (seen[key] ?: 0) + 1
                              seen[key] = c
                              if (c == 1) firstSeen[key] = n
                          } else {
                              seen[key] = 0
                              firstSeen.remove(key)
                          }
                          if ((seen[key] ?: 0) >= 2) {
                              have[dish] = haveOf(dish) + 1
                              val waited = n - (firstSeen[key] ?: n)
                              if (n - (usedAt[key] ?: 0L) > 1500L && n - (tapAt[dish] ?: 0L) > 1200L && waited >= delay) {
                                  res.getOrPut(dish) { ArrayList() }.add(Src(key, l))
                              }
                          }
                      }
                  }
                  return res
              }

              // Подача: тянем готовое блюдо только тем клиентам, которым оно ещё нужно
              private fun serve(slots: List<List<String>>, av: HashMap<String, ArrayList<Src>>) {
                  if (S.get("serveOn") == 0) return
                  val maxN = S.get("serveMax")
                  val acts = ArrayList<Act>()
                  val n = now()
                  for ((si, items) in slots.withIndex()) {
                      val counts = items.groupingBy { it }.eachCount()
                      for ((name, cnt) in counts) {
                          if (name == "?") continue
                          val list = av[name] ?: continue
                          var need = cnt - recent(sentAt, "" + si + name, 2000L)
                          val c = Cfg.customer(Vision.SLOT_X[si])
                          while (need > 0 && list.isNotEmpty() && acts.size < maxN) {
                              val s = list.removeAt(0)
                              usedAt[s.key] = n
                              mark(sentAt, "" + si + name)
                              acts.add(Act(s.p[0], s.p[1], c[0], c[1], true))
                              need--
                          }
                      }
                  }
                  if (acts.isNotEmpty()) go(acts, S.get("serveGap").toLong())
              }

              // Фритюрница: быстро нажать источник нужное число раз, подождать, забрать на тарелки
              private fun cook(key: String, dish: String, src: IntArray, out: IntArray, cookMs: Long, want: Int) {
                  val c = collectAt[key]
                  if (c != null) {
                      if (now() >= c) {
                          val k = cookN[key] ?: 1
                          go(List(k) { tapA(out) })
                          collectAt.remove(key)
                          for (i in 0 until k) mark(madeAt, dish)
                      }
                  } else if (want > 0 && due(key, 800L)) {
                      val k = minOf(want, 2)
                      go(List(k) { tapA(src) })
                      cookN[key] = k
                      collectAt[key] = now() + cookMs
                  }
              }

              private fun pizza(count: Int) {
                  if (now() < pizzaBusyUntil) return
                  val n = minOf(count, 2)
                  val pg = S.get("pizzaGap").toLong()
                  val acts = ArrayList<Act>()
                  for (i in 0 until n) {
                      acts.add(tapA(Cfg.SAUSAGE))
                      acts.add(tapA(Cfg.ONION))
                  }
                  go(acts, pg)
                  Thread.sleep(400)
                  val bases = listOf(tapA(Cfg.BASE1), tapA(Cfg.BASE2))
                  go(bases.take(n), pg)
                  for (i in 0 until n) mark(madeAt, "pizza")
                  pizzaBusyUntil = now() + S.get("pizzaRound").toLong()
              }

              private fun burger(tgt: Int, bmp: Bitmap) {
                  val hb = haveOf("burger")
                  val gs = Cfg.GRILLS.map { Vision.grillState(bmp, it[0], it[1]) }
                  if (bPhase == 0) {
                      val need = minOf(4 - hb, tgt - hb)
                      if (now() > bBlock && need > 0 && due("bstart", 2000L)) {
                          val free = gs.count { it == 0 }
                          val onGrill = gs.count { it != 0 }
                          val raw = minOf(free, maxOf(0, need - onGrill))
                          val acts = ArrayList<Act>()
                          for (i in 0 until raw) acts.add(tapA(Cfg.PATTY))
                          for (i in 0 until need) acts.add(tapA(Cfg.LETTUCE))
                          for (i in 0 until need) acts.add(tapA(Cfg.TOMATO))
                          go(acts)
                          bPhase = 1
                          bNeed = need
                          bGot = 0
                          bStart = now()
                      }
                  } else {
                      val ready = ArrayList<IntArray>()
                      for ((i, g) in Cfg.GRILLS.withIndex()) if (gs[i] == 2) ready.add(g)
                      if (ready.isNotEmpty() && bGot < bNeed && due("grl", 900L)) {
                          val take = ready.take(bNeed - bGot)
                          go(take.map { tapA(it) })
                          bGot += take.size
                      }
                      if (bGot >= bNeed || now() - bStart > 25000L) {
                          if (bGot > 0) {
                              val acts = ArrayList<Act>()
                              for (i in 0 until bGot) acts.add(tapA(Cfg.BUN))
                              go(acts)
                          }
                          bPhase = 0
                          bBlock = now() + 2500L
                      }
                  }
              }

              private fun step() {
                  val bmp = cap.frame()
                  if (bmp == null) {
                      ui("Нет кадра экрана")
                      Thread.sleep(400)
                      return
                  }
                  frames++
                  val slots = Vision.SLOT_X.map { Vision.slotItems(bmp, it) }
                  val dem = HashMap<String, Int>()
                  for (s in slots) for (n in s) if (n != "?") dem[n] = (dem[n] ?: 0) + 1
                  val av = scan(bmp)
                  val active = dem.isNotEmpty() || S.get("idle") == 1

                  val sb = StringBuilder()
                  for ((i, s) in slots.withIndex()) {
                      sb.append(i + 1).append(": ")
                      sb.append(if (s.isEmpty()) "-" else s.joinToString("+") { ru[it] ?: it })
                      sb.append("\n")
                  }
                  sb.append("готово: ")
                  val hv = have.entries.filter { it.value > 0 }
                  sb.append(if (hv.isEmpty()) "-" else hv.joinToString(" ") { (ru[it.key] ?: it.key) + it.value })
                  sb.append("\n")
                  sb.append("кадр ").append(frames).append("\n")
                  sb.append(cap.info()).append(" sig=").append(Integer.toHexString(sig(bmp)).takeLast(5))
                  if (!TapService.ready()) {
                      ui(sb.toString() + "\nВключи службу спецвозможностей!")
                      Thread.sleep(500)
                      return
                  }
                  ui(sb.toString())
                  if (!active && bPhase == 0 && collectAt.isEmpty()) {
                      Thread.sleep(300)
                      return
                  }

                  // 1. Подача: готовое блюдо тянем к клиенту
                  serve(slots, av)

                  // 2. Приготовление: держим в наличии max(заказы, запас) штук каждого блюда
                  val wCola = target("cola", dem, active) - haveOf("cola") - made("cola")
                  if (wCola > 0 && due("cola", 700L)) {
                      val k = minOf(wCola, 3)
                      go(List(k) { tapA(Cfg.COLA_M) })
                      tapAt["cola"] = now()
                      for (i in 0 until k) mark(madeAt, "cola")
                  }
                  val wIce = target("icecream", dem, active) - haveOf("icecream") - made("icecream")
                  if (wIce > 0 && due("ice", 700L)) {
                      val k = minOf(wIce, 3)
                      go(List(k) { tapA(Cfg.ICE_M) })
                      tapAt["icecream"] = now()
                      for (i in 0 until k) mark(madeAt, "icecream")
                  }
                  val fry = S.get("fryMs").toLong()
                  val wChk = target("chicken", dem, active) - haveOf("chicken") - made("chicken")
                  cook("chk", "chicken", Cfg.CHK_SRC, Cfg.FRY1, fry, wChk)
                  val wFry = target("fries", dem, active) - haveOf("fries") - made("fries")
                  cook("fry", "fries", Cfg.POT_SRC, Cfg.FRY2, fry, wFry)
                  val wPiz = target("pizza", dem, active) - haveOf("pizza") - made("pizza")
                  if (wPiz > 0) pizza(wPiz)
                  val tBur = target("burger", dem, active)
                  if (tBur > haveOf("burger") || bPhase != 0) burger(tBur, bmp)
              }
          }
