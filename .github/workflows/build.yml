          package com.bot.cook

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.graphics.Rect
          import android.os.Build
          import android.view.Display
          import java.util.concurrent.CountDownLatch
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit

          interface Frames {
              fun frame(): Bitmap?
              fun info(): String
          }

          // Кадры через скриншот службы спецвозможностей (Android 11+)
          class ShotCapture : Frames {
              private val exec = Executors.newSingleThreadExecutor()
              private val out: Bitmap = Bitmap.createBitmap(Vision.RW, Vision.RH, Bitmap.Config.ARGB_8888)
              private val canvas = Canvas(out)
              private val paint = Paint(Paint.FILTER_BITMAP_FLAG)
              private val dst = Rect(0, 0, Vision.RW, Vision.RH)
              private var lastReq = 0L
              private var have = false
              private var ok = 0
              private var fails = 0
              private var failRun = 0
              private var lastErr = 0
              private var size = "-"

              fun usable(): Boolean = Build.VERSION.SDK_INT >= 30 && failRun < 5

              override fun info(): String = "SHOT ok=" + ok + " err=" + fails + "(" + lastErr + ") " + size

              override fun frame(): Bitmap? {
                  if (Build.VERSION.SDK_INT < 30) return null
                  val svc = TapService.inst ?: return null
                  val wait = 350L - (System.currentTimeMillis() - lastReq)
                  if (wait > 0) Thread.sleep(wait)
                  lastReq = System.currentTimeMillis()
                  val latch = CountDownLatch(1)
                  var got: Bitmap? = null
                  var code = 0
                  svc.takeScreenshot(Display.DEFAULT_DISPLAY, exec, object : AccessibilityService.TakeScreenshotCallback {
                      override fun onSuccess(r: AccessibilityService.ScreenshotResult) {
                          try {
                              val hb = r.hardwareBuffer
                              val hw = Bitmap.wrapHardwareBuffer(hb, r.colorSpace)
                              if (hw != null) {
                                  got = hw.copy(Bitmap.Config.ARGB_8888, false)
                                  hw.recycle()
                              }
                              hb.close()
                          } catch (e: Throwable) {
                              code = -1
                          }
                          latch.countDown()
                      }

                      override fun onFailure(errorCode: Int) {
                          code = errorCode
                          latch.countDown()
                      }
                  })
                  if (!latch.await(1500, TimeUnit.MILLISECONDS)) code = -2
                  val b = got
                  if (b == null) {
                      fails++
                      failRun++
                      lastErr = if (code != 0) code else -3
                      return if (have && usable()) out else null
                  }
                  size = b.width.toString() + "x" + b.height
                  canvas.drawBitmap(b, Rect(0, 0, b.width, b.height), dst, paint)
                  b.recycle()
                  ok++
                  failRun = 0
                  have = true
                  return out
              }
          }

          // Сначала скриншоты; если они не работают - запись экрана (MediaProjection)
          class AutoFrames(private val shot: ShotCapture, private val mp: Capture?) : Frames {
              override fun frame(): Bitmap? {
                  if (shot.usable()) {
                      val b = shot.frame()
                      if (b != null) return b
                  }
                  return mp?.frame()
              }

              override fun info(): String =
                  if (shot.usable()) shot.info() else (mp?.info() ?: "нет захвата") + " | " + shot.info()
          }
