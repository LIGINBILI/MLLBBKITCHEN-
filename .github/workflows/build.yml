          package com.bot.cook

          class Engine(private val cap: Capture, private val ui: (String) -> Unit) : Thread() {
              @Volatile
              var running = true
              private val last = HashMap<String, Long>()
              private val collectAt = HashMap<String, Long>()
              private val ru = mapOf(
                  "pizza" to "пицца", "burger" to "бургер", "cola" to "кола",
                  "icecream" to "мороженое", "fries" to "фри", "chicken" to "курица", "?" to "?"
              )

              private fun now() = System.currentTimeMillis()

              private fun due(k: String, ms: Long): Boolean {
                  val n = now()
                  val l = last[k] ?: 0L
                  if (n - l >= ms) {
                      last[k] = n
                      return true
                  }
                  return false
              }

              private fun tap(pts: List<IntArray>) {
                  TapService.run(pts)
              }

              // Приготовление: нажать источник, подождать cookMs, нажать выход
              private fun cook(key: String, src: List<IntArray>, out: List<IntArray>, cookMs: Long) {
                  val c = collectAt[key]
                  if (c != null) {
                      if (now() >= c) {
                          tap(out)
                          collectAt.remove(key)
                      }
                  } else if (due(key, 1500)) {
                      tap(src)
                      collectAt[key] = now() + cookMs
                  }
              }

              override fun run() {
                  while (running) {
                      try {
                          step()
                      } catch (e: Exception) {
                          ui("Ошибка: " + e.message)
                      }
                      try {
                          Thread.sleep(150)
                      } catch (e: InterruptedException) {
                          return
                      }
                  }
              }

              private fun step() {
                  val bmp = cap.frame()
                  if (bmp == null) {
                      ui("Нет кадра экрана")
                      Thread.sleep(400)
                      return
                  }
                  val slots = Vision.SLOT_X.map { Vision.slotItems(bmp, it) }
                  val need = HashSet<String>()
                  for (s in slots) need.addAll(s)
                  val sb = StringBuilder()
                  for ((i, s) in slots.withIndex()) {
                      sb.append(i + 1).append(": ")
                      sb.append(if (s.isEmpty()) "-" else s.joinToString("+") { ru[it] ?: it })
                      sb.append("\n")
                  }
                  if (!TapService.ready()) {
                      ui(sb.toString() + "Включи службу спецвозможностей!")
                      Thread.sleep(500)
                      return
                  }
                  ui(sb.toString().trim())
                  if (need.isEmpty()) {
                      Thread.sleep(300)
                      return
                  }

                  // 1. Подача готового блюда клиенту
                  for ((si, items) in slots.withIndex()) {
                      for (name in items.distinct()) {
                          val locs = Cfg.SERVE[name] ?: continue
                          if (due("s$si$name", 1100)) {
                              val pts = ArrayList<IntArray>()
                              for (l in locs.take(4)) {
                                  pts.add(l)
                                  pts.add(Cfg.p(Vision.SLOT_X[si], 330))
                              }
                              tap(pts)
                          }
                      }
                  }

                  // 2. Приготовление нужного
                  if ("cola" in need && due("cola", 3500)) tap(listOf(Cfg.COLA_M))
                  if ("icecream" in need && due("ice", 3500)) tap(listOf(Cfg.ICE_M))
                  if ("chicken" in need) cook("chk", listOf(Cfg.CHK_SRC), listOf(Cfg.FRY1), 5500)
                  if ("fries" in need) cook("fry", listOf(Cfg.POT_SRC), listOf(Cfg.FRY2), 5500)
                  if ("pizza" in need) {
                      cook(
                          "piz",
                          listOf(Cfg.SAUSAGE, Cfg.ONION, Cfg.BASE1, Cfg.SAUSAGE, Cfg.ONION, Cfg.BASE2),
                          Cfg.OVENS, 6000
                      )
                  }
                  if ("burger" in need) {
                      val st = Cfg.GRILLS.map { Vision.grillState(bmp, it[0], it[1]) }
                      if (st.any { it == 0 } && due("pat", 4000)) tap(listOf(Cfg.PATTY))
                      val ready = ArrayList<IntArray>()
                      for ((i, g) in Cfg.GRILLS.withIndex()) if (st[i] == 2) ready.add(g)
                      if (ready.isNotEmpty() && due("grl", 900)) tap(ready)
                      if (due("bun", 3500)) tap(listOf(Cfg.LETTUCE, Cfg.TOMATO, Cfg.BUN))
                  }
              }
          }
