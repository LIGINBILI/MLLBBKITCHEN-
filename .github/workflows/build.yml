          package com.bot.cook

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.util.DisplayMetrics
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import kotlin.math.max
          import kotlin.math.min

          class BotService : Service() {
              private var proj: MediaProjection? = null
              private var cap: Capture? = null
              private var frames: Frames? = null
              private var engine: Engine? = null
              private var wm: WindowManager? = null
              private var panel: LinearLayout? = null
              private val main = Handler(Looper.getMainLooper())

              override fun onBind(intent: Intent?): IBinder? = null

              @Suppress("DEPRECATION")
              private fun readData(i: Intent): Intent? = i.getParcelableExtra<Intent>("data")

              @Suppress("DEPRECATION")
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent == null) return START_NOT_STICKY
                  S.init(this)
                  val ch = "cookbot"
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel(ch, "Cook Bot", NotificationManager.IMPORTANCE_LOW))
                  val n: Notification = Notification.Builder(this, ch)
                      .setContentTitle("Бот запущен")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(1, n)
                  }
                  val code = intent.getIntExtra("code", 0)
                  val data = readData(intent) ?: return START_NOT_STICKY
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val p = mpm.getMediaProjection(code, data)
                  p.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopSelf()
                      }
                  }, main)
                  proj = p
                  val dm = DisplayMetrics()
                  (getSystemService(Context.WINDOW_SERVICE) as WindowManager).defaultDisplay.getRealMetrics(dm)
                  cap = Capture(p, max(dm.widthPixels, dm.heightPixels), min(dm.widthPixels, dm.heightPixels), dm.densityDpi)
                  frames = AutoFrames(ShotCapture(), cap)
                  showPanel()
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              private fun showPanel() {
                  val w = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  wm = w
                  val tv = TextView(this)
                  tv.setTextColor(Color.WHITE)
                  tv.textSize = 11f
                  tv.text = "Готов"
                  val btn = Button(this)
                  btn.text = "СТАРТ"
                  val close = Button(this)
                  close.text = "X"
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.addView(btn)
                  row.addView(close)
                  val handle = TextView(this)
                  handle.text = "✥ тяни за меня"
                  handle.setTextColor(Color.WHITE)
                  handle.textSize = 12f
                  handle.setPadding(20, 16, 20, 16)
                  handle.setBackgroundColor(Color.argb(220, 60, 60, 170))
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setBackgroundColor(Color.argb(150, 0, 0, 0))
                  box.addView(handle)
                  box.addView(row)
                  box.addView(tv)
                  btn.setOnClickListener {
                      val e = engine
                      if (e != null && e.running) {
                          e.running = false
                          engine = null
                          btn.text = "СТАРТ"
                      } else {
                          val c = frames
                          if (c != null) {
                              val ne = Engine(c) { s -> main.post { tv.text = s } }
                              engine = ne
                              ne.start()
                              btn.text = "СТОП"
                          }
                      }
                  }
                  close.setOnClickListener { stopSelf() }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.START
                  lp.x = 0
                  lp.y = 0
                  val st = FloatArray(4)
                  val drag = View.OnTouchListener { _, ev ->
                      when (ev.action) {
                          MotionEvent.ACTION_DOWN -> {
                              st[0] = ev.rawX
                              st[1] = ev.rawY
                              st[2] = lp.x.toFloat()
                              st[3] = lp.y.toFloat()
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dm = DisplayMetrics()
                              w.defaultDisplay.getRealMetrics(dm)
                              val maxX = max(0, dm.widthPixels - box.width)
                              val maxY = max(0, dm.heightPixels - box.height)
                              lp.x = (st[2] + ev.rawX - st[0]).toInt().coerceIn(0, maxX)
                              lp.y = (st[3] + ev.rawY - st[1]).toInt().coerceIn(0, maxY)
                              w.updateViewLayout(box, lp)
                          }
                      }
                      true
                  }
                  handle.setOnTouchListener(drag)
                  tv.setOnTouchListener(drag)
                  w.addView(box, lp)
                  panel = box
              }

              override fun onDestroy() {
                  engine?.running = false
                  panel?.let { wm?.removeView(it) }
                  cap?.release()
                  proj?.stop()
                  super.onDestroy()
              }
          }
